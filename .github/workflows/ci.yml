name: CI

on:
  push:
  pull_request:

env:
  WGPU_VERSION: v29.0.1.1

jobs:
  linux:
    # Software Vulkan (lavapipe): the tests run with no GPU.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu, wgpu-native and lavapipe
        run: |
          curl -fsSL https://eskiu-lang.org/install.sh | ESKIU_PREFIX=$HOME/.eskiu sh
          echo "$HOME/.eskiu/bin" >> $GITHUB_PATH
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 unzip
          curl -fsSL -o wgpu.zip https://github.com/gfx-rs/wgpu-native/releases/download/$WGPU_VERSION/wgpu-linux-x86_64-release.zip
          unzip -q wgpu.zip -d $HOME/wgpu
      - name: SDL3 from source, with tools/sdl3_prebuilt.sh (tests/window_input.esk)
        run: |
          sudo apt-get install -y cmake ninja-build libx11-dev libxext-dev libudev-dev
          tools/sdl3_prebuilt.sh linux-x86_64 $HOME/sdl3
          tar -xzf $HOME/sdl3/sdl3-*-linux-x86_64.tar.gz -C $HOME/sdl3
      - name: Layout check
        run: CC=cc ESKIUC=eskiuc tools/layout_check.sh $HOME/wgpu/include/webgpu $HOME/wgpu/lib
      - name: Tests
        run: LD_LIBRARY_PATH=$HOME/sdl3/lib eskiuc test -L$HOME/sdl3/lib
      - name: API reference is current
        run: python3 -I tools/gen_api.py --check

  web:
    # Emscripten with the emdawnwebgpu port: the layout check, the examples built for a
    # browser, the compute example under node (no WebGPU there, so it reports that), and
    # the render tests on the WebGL2 backend in headless Chrome.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu and emsdk
        run: |
          curl -fsSL https://eskiu-lang.org/install.sh | ESKIU_PREFIX=$HOME/.eskiu sh
          echo "$HOME/.eskiu/bin" >> $GITHUB_PATH
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git $HOME/emsdk
          $HOME/emsdk/emsdk install 5.0.2
          $HOME/emsdk/emsdk activate 5.0.2
      - name: Layout check
        run: |
          source $HOME/emsdk/emsdk_env.sh
          ESKIUC=eskiuc tools/layout_check.sh --web
      - name: Examples build
        run: |
          source $HOME/emsdk/emsdk_env.sh
          mkdir -p build/web
          for f in triangle cube model compute; do
            eskiuc examples/$f.esk --target wasm32-unknown-emscripten -o build/web/$f.html \
              --link-arg=--use-port=emdawnwebgpu --link-arg=-sJSPI --link-arg=-sALLOW_MEMORY_GROWTH=1
          done
          eskiuc examples/compute.esk --target wasm32-unknown-emscripten -o build/web/compute_asyncify.js \
            --link-arg=--use-port=emdawnwebgpu --link-arg=-sASYNCIFY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compute under node
        run: |
          for run in "node --experimental-wasm-jspi build/web/compute.js" "node build/web/compute_asyncify.js"; do
            out=$($run)
            echo "$run: $out"
            test "$out" = "error: no WebGPU in this browser"
          done
      - name: WebGL2 backend in Chrome
        # WebGPU off and navigator.gpu removed, as in Firefox; SwiftShader renders WebGL2 on
        # the CPU. The tests compare against the same golden images as on WebGPU.
        run: |
          source $HOME/emsdk/emsdk_env.sh
          export CHROME=$(command -v google-chrome)
          for t in render_offscreen render_api render_stencil render_targets texture_options model_render morph; do
            eskiuc tests/$t.esk --target wasm32-unknown-emscripten -o build/web/$t.js \
              --link-arg=--use-port=emdawnwebgpu --link-arg=-sASYNCIFY --link-arg=-sEXIT_RUNTIME=1 \
              --link-arg=-sALLOW_MEMORY_GROWTH=1 --link-arg=--preload-file=tests/data@tests/data
            node tools/web_run.mjs build/web/$t.js --no-webgpu --swiftshader
          done

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu, wgpu-native and SDL3
        run: |
          brew install eskiu-lang/eskiu/eskiu wgpu-native sdl3
      - name: Layout check
        run: CC=cc ESKIUC=eskiuc tools/layout_check.sh $(brew --prefix wgpu-native)/include $(brew --prefix)/lib
      - name: Tests
        run: eskiuc test -L$(brew --prefix)/lib
      - name: Examples build
        run: |
          mkdir -p build
          for f in examples/*.esk; do eskiuc -L$(brew --prefix)/lib "$f" -o build/$(basename "$f" .esk); done

  windows:
    # DirectX 12 through WARP, Windows' software adapter: the tests run with no GPU.
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-sdl3 unzip diffutils
      - name: Install Eskiu and wgpu-native
        run: |
          curl -fsSL -o eskiu.zip https://github.com/eskiu-lang/eskiu/releases/latest/download/eskiuc-windows-x86_64.zip
          # The archive's paths use backslashes; unzip extracts it and exits with 1 (a warning).
          unzip -q eskiu.zip -d $HOME/eskiu || [ $? -eq 1 ]
          test -x $HOME/eskiu/bin/eskiuc.exe
          curl -fsSL -o wgpu.zip https://github.com/gfx-rs/wgpu-native/releases/download/$WGPU_VERSION/wgpu-windows-x86_64-gnu-release.zip
          unzip -q wgpu.zip -d $HOME/wgpu
      - name: Layout check
        run: |
          export PATH="$HOME/eskiu/bin:$HOME/wgpu/lib:$PATH"
          CC=gcc ESKIUC=eskiuc tools/layout_check.sh $HOME/wgpu/include/webgpu $HOME/wgpu/lib
      - name: Tests
        run: |
          export PATH="$HOME/eskiu/bin:$PATH"
          CC=gcc eskiuc test
