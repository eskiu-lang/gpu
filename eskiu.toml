[package]
name = "gpu"
version = "0.6.0"
main = "examples/compute.esk"

[deps]

# Files a web build needs next to the page (Eskiu 0.15.1 or newer): the WebGL2 backend's
# WGSL to GLSL translator, copied beside the output of a wasm32-unknown-emscripten build.
[web]
assets = ["web/gpu-naga.wasm"]

# wgpu-native's own release archives, fetched by eskiuc build / run / test / fetch.
