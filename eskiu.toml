[package]
name = "gpu"
version = "0.1.0"
main = "examples/compute.esk"

[deps]

# wgpu-native's own release archives, fetched by eskiuc build / run / test / fetch. SDL3
# (<gpu/window>) has no prebuilt macOS or Linux library: it comes from the system.
